<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 374" width="720" height="374" role="img" aria-labelledby="t d"><title id="t">Replay: writing the state every L steps</title><desc id="d">Diagram: stock writes a full state block every step; replay writes a full block only at step 8 and small ring entries in between.</desc><style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#7a7975}
  .grid{stroke:#e6e5e0;stroke-width:1} .axis{stroke:#c9c8c2;stroke-width:1}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s0{fill:#d9d8d2} .s1l{stroke:#2a78d6} .s2l{stroke:#eb6834}
  .wash1{fill:#2a78d6;fill-opacity:.10} .box{fill:#f1f0ec;stroke:#d9d8d2}
  .gap{stroke:#fcfcfb;stroke-width:2}
  text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
</style><rect class="bg" width="720" height="374" rx="8"/><text x="24" y="34" class="t1" font-size="16" text-anchor="start" font-weight="600">Writing the GDN state less often</text><text x="24" y="56" class="t2" font-size="13" text-anchor="start" font-weight="400">Replay writes the full state every L steps and keeps small per-step inputs in a ring buffer.</text><text x="24" y="118" class="t1" font-size="13" text-anchor="start" font-weight="600">Stock</text><text x="24" y="134" class="t3" font-size="11" text-anchor="start" font-weight="400">full write each step</text><text x="24" y="218" class="t1" font-size="13" text-anchor="start" font-weight="600">Replay (L = 8)</text><text x="24" y="234" class="t3" font-size="11" text-anchor="start" font-weight="400">full write every 8th</text><text x="172" y="88" class="t3" font-size="11" text-anchor="middle" font-weight="400">t1</text><rect x="150" y="100" width="44" height="40" rx="4" class="s2"/><rect x="164" y="226" width="16" height="14" rx="3" class="s1"/><text x="230" y="88" class="t3" font-size="11" text-anchor="middle" font-weight="400">t2</text><rect x="208" y="100" width="44" height="40" rx="4" class="s2"/><rect x="222" y="226" width="16" height="14" rx="3" class="s1"/><text x="288" y="88" class="t3" font-size="11" text-anchor="middle" font-weight="400">t3</text><rect x="266" y="100" width="44" height="40" rx="4" class="s2"/><rect x="280" y="226" width="16" height="14" rx="3" class="s1"/><text x="346" y="88" class="t3" font-size="11" text-anchor="middle" font-weight="400">t4</text><rect x="324" y="100" width="44" height="40" rx="4" class="s2"/><rect x="338" y="226" width="16" height="14" rx="3" class="s1"/><text x="404" y="88" class="t3" font-size="11" text-anchor="middle" font-weight="400">t5</text><rect x="382" y="100" width="44" height="40" rx="4" class="s2"/><rect x="396" y="226" width="16" height="14" rx="3" class="s1"/><text x="462" y="88" class="t3" font-size="11" text-anchor="middle" font-weight="400">t6</text><rect x="440" y="100" width="44" height="40" rx="4" class="s2"/><rect x="454" y="226" width="16" height="14" rx="3" class="s1"/><text x="520" y="88" class="t3" font-size="11" text-anchor="middle" font-weight="400">t7</text><rect x="498" y="100" width="44" height="40" rx="4" class="s2"/><rect x="512" y="226" width="16" height="14" rx="3" class="s1"/><text x="578" y="88" class="t3" font-size="11" text-anchor="middle" font-weight="400">t8</text><rect x="556" y="100" width="44" height="40" rx="4" class="s2"/><rect x="556" y="200" width="44" height="40" rx="4" class="s2"/><text x="636" y="88" class="t3" font-size="11" text-anchor="middle" font-weight="400">t9</text><rect x="614" y="100" width="44" height="40" rx="4" class="s2"/><rect x="628" y="226" width="16" height="14" rx="3" class="s1"/><line x1="144" y1="252" x2="672" y2="252" class="axis"/><rect x="150" y="275" width="14" height="14" rx="3" class="s2"/><text x="170" y="286" class="t2" font-size="12" text-anchor="start" font-weight="400">full state write (75 MB per request, bf16)</text><rect x="440" y="278" width="10" height="9" rx="2" class="s1"/><text x="458" y="286" class="t2" font-size="12" text-anchor="start" font-weight="400">ring entry: k, corrected v, decay</text><text x="24" y="318" class="t2" font-size="12" text-anchor="start" font-weight="400">To read the current state, the kernel rebuilds it from the last full write plus the ring entries since then.</text><text x="24" y="336" class="t2" font-size="12" text-anchor="start" font-weight="400">At 256 requests: ~17 GB of writes skipped per step, ~1.6 GB of ring reads added.</text><text x="24" y="354" class="t2" font-size="12" text-anchor="start" font-weight="400">Measured decode step: 36.2 → 32.2 ms.</text></svg>
