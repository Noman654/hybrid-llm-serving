<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" width="720" height="306" role="img" aria-labelledby="t d"><title id="t">Step sizes vs the CUDA-graph limit</title><desc id="d">Number line of tokens per step: decode-only steps up to 256, median mixed step 770, p90 1300; graphs cover up to 512 by default and up to 2048 when raised.</desc><style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#7a7975}
  .grid{stroke:#e6e5e0;stroke-width:1} .axis{stroke:#c9c8c2;stroke-width:1}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s0{fill:#d9d8d2} .s1l{stroke:#2a78d6} .s2l{stroke:#eb6834}
  .wash1{fill:#2a78d6;fill-opacity:.10} .box{fill:#f1f0ec;stroke:#d9d8d2}
  .gap{stroke:#fcfcfb;stroke-width:2}
  text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
</style><rect class="bg" width="720" height="306" rx="8"/><text x="24" y="34" class="t1" font-size="16" text-anchor="start" font-weight="600">Which steps get a CUDA graph</text><text x="24" y="56" class="t2" font-size="13" text-anchor="start" font-weight="400">Tokens per engine step in the serving mix (512-token prompts, 256 concurrent)</text><text x="178" y="108" class="t2" font-size="13" text-anchor="end" font-weight="400">Default limit (512)</text><rect x="190" y="92" width="116.36363636363637" height="22" class="wash1"/><text x="298.3636363636364" y="107" class="t2" font-size="11" text-anchor="end" font-weight="400">graphs</text><text x="178" y="144" class="t2" font-size="13" text-anchor="end" font-weight="400">Raised limit (2,048)</text><rect x="190" y="128" width="465.4545454545455" height="22" class="wash1"/><text x="647.4545454545455" y="143" class="t2" font-size="11" text-anchor="end" font-weight="400">graphs</text><text x="178" y="190" class="t2" font-size="13" text-anchor="end" font-weight="400">Step sizes</text><line x1="190" y1="186" x2="690" y2="186" class="axis"/><line x1="190.0" y1="82" x2="190.0" y2="191" class="grid"/><text x="190.0" y="234" class="t3" font-size="11" text-anchor="middle" font-weight="400">0</text><line x1="306.3636363636364" y1="82" x2="306.3636363636364" y2="191" class="grid"/><text x="306.3636363636364" y="234" class="t3" font-size="11" text-anchor="middle" font-weight="400">512</text><line x1="422.72727272727275" y1="82" x2="422.72727272727275" y2="191" class="grid"/><text x="422.72727272727275" y="234" class="t3" font-size="11" text-anchor="middle" font-weight="400">1,024</text><line x1="539.090909090909" y1="82" x2="539.090909090909" y2="191" class="grid"/><text x="539.090909090909" y="234" class="t3" font-size="11" text-anchor="middle" font-weight="400">1,536</text><line x1="655.4545454545455" y1="82" x2="655.4545454545455" y2="191" class="grid"/><text x="655.4545454545455" y="234" class="t3" font-size="11" text-anchor="middle" font-weight="400">2,048</text><circle cx="248.1818181818182" cy="186" r="8" class="bg"/><circle cx="248.1818181818182" cy="186" r="6" class="s1"/><text x="248.1818181818182" y="212" class="t1" font-size="12" text-anchor="middle" font-weight="400">decode-only ≤ 256</text><circle cx="365.0" cy="186" r="8" class="bg"/><circle cx="365.0" cy="186" r="6" class="s2"/><text x="365.0" y="172" class="t1" font-size="12" text-anchor="middle" font-weight="400">median mixed ≈ 770</text><circle cx="485.45454545454544" cy="186" r="8" class="bg"/><circle cx="485.45454545454544" cy="186" r="6" class="s2"/><text x="485.45454545454544" y="212" class="t1" font-size="12" text-anchor="middle" font-weight="400">p90 ≈ 1,300</text><text x="24" y="270" class="t2" font-size="12" text-anchor="start" font-weight="400">46% of wall time was in steps between 512 and 2,048 tokens. At the default limit none of them got a graph,</text><text x="24" y="288" class="t2" font-size="12" text-anchor="start" font-weight="400">so Python launched each step's kernels one by one while the GPU waited.</text></svg>
