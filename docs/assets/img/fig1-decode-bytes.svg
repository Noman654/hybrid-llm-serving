<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="t d"><title id="t">What one decode step moves</title><desc id="d">Bar chart: weights 30 GB read; GDN state 19 GB read and 19 GB written per decode step at 256 requests.</desc><style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#7a7975}
  .grid{stroke:#e6e5e0;stroke-width:1} .axis{stroke:#c9c8c2;stroke-width:1}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s0{fill:#d9d8d2} .s1l{stroke:#2a78d6} .s2l{stroke:#eb6834}
  .wash1{fill:#2a78d6;fill-opacity:.10} .box{fill:#f1f0ec;stroke:#d9d8d2}
  .gap{stroke:#fcfcfb;stroke-width:2}
  text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
</style><rect class="bg" width="720" height="280" rx="8"/><text x="24" y="34" class="t1" font-size="16" text-anchor="start" font-weight="600">What one decode step moves through memory</text><text x="24" y="56" class="t2" font-size="13" text-anchor="start" font-weight="400">256 concurrent requests, bf16 GDN state, H100 at 3.35 TB/s</text><line x1="190.0" y1="76" x2="190.0" y2="206" class="grid"/><text x="190.0" y="222" class="t3" font-size="11" text-anchor="middle" font-weight="400">0 GB</text><line x1="300.0" y1="76" x2="300.0" y2="206" class="grid"/><text x="300.0" y="222" class="t3" font-size="11" text-anchor="middle" font-weight="400">10 GB</text><line x1="410.0" y1="76" x2="410.0" y2="206" class="grid"/><text x="410.0" y="222" class="t3" font-size="11" text-anchor="middle" font-weight="400">20 GB</text><line x1="520.0" y1="76" x2="520.0" y2="206" class="grid"/><text x="520.0" y="222" class="t3" font-size="11" text-anchor="middle" font-weight="400">30 GB</text><line x1="630.0" y1="76" x2="630.0" y2="206" class="grid"/><text x="630.0" y="222" class="t3" font-size="11" text-anchor="middle" font-weight="400">40 GB</text><text x="178" y="109" class="t2" font-size="13" text-anchor="end" font-weight="400">Weights (read)</text><path class="s1" d="M190,92 h322.7 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-322.7 z"/><text x="524.7" y="109" class="t1" font-size="13" text-anchor="start" font-weight="400">30 GB</text><text x="178" y="149" class="t2" font-size="13" text-anchor="end" font-weight="400">GDN state (read)</text><path class="s2" d="M190,132 h205.0 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-205.0 z"/><text x="407.0" y="149" class="t1" font-size="13" text-anchor="start" font-weight="400">19 GB</text><text x="178" y="189" class="t2" font-size="13" text-anchor="end" font-weight="400">GDN state (write)</text><path class="s2" d="M190,172 h205.0 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-205.0 z"/><text x="407.0" y="189" class="t1" font-size="13" text-anchor="start" font-weight="400">19 GB</text><path d="M461.0,136 h8 v64 h-8" fill="none" class="axis" stroke-width="1.5"/><text x="477.0" y="166" class="t1" font-size="13" text-anchor="start" font-weight="600">38 GB</text><text x="477.0" y="184" class="t2" font-size="12" text-anchor="start" font-weight="400">≈ 11.5 ms</text><text x="576.7" y="109" class="t2" font-size="12" text-anchor="start" font-weight="400">≈ 9 ms</text><text x="24" y="262" class="t2" font-size="12" text-anchor="start" font-weight="400">The state traffic is larger than the weight traffic, so the state's size and dtype matter a lot.</text></svg>
