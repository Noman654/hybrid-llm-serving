<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 338" width="720" height="338" role="img" aria-labelledby="t d"><title id="t">Where prefill GPU time goes</title><desc id="d">Bar chart of prefill kernel time shares: FP8 GEMM 71.1%, norms/activations/quant 17.4%, other 5%, conv1d+prep 3.5%, GDN core 2.8%, attention 0.2%.</desc><style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#7a7975}
  .grid{stroke:#e6e5e0;stroke-width:1} .axis{stroke:#c9c8c2;stroke-width:1}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s0{fill:#d9d8d2} .s1l{stroke:#2a78d6} .s2l{stroke:#eb6834}
  .wash1{fill:#2a78d6;fill-opacity:.10} .box{fill:#f1f0ec;stroke:#d9d8d2}
  .gap{stroke:#fcfcfb;stroke-width:2}
  text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
</style><rect class="bg" width="720" height="338" rx="8"/><text x="24" y="34" class="t1" font-size="16" text-anchor="start" font-weight="600">Where prefill GPU time goes</text><text x="24" y="56" class="t2" font-size="13" text-anchor="start" font-weight="400">Share of kernel time, 256 prompts × 4,096 tokens, one H100 (FlashInfer GDN prefill)</text><line x1="210.0" y1="76" x2="210.0" y2="282" class="grid"/><text x="210.0" y="298" class="t3" font-size="11" text-anchor="middle" font-weight="400">0%</text><line x1="322.0" y1="76" x2="322.0" y2="282" class="grid"/><text x="322.0" y="298" class="t3" font-size="11" text-anchor="middle" font-weight="400">20%</text><line x1="434.0" y1="76" x2="434.0" y2="282" class="grid"/><text x="434.0" y="298" class="t3" font-size="11" text-anchor="middle" font-weight="400">40%</text><line x1="546.0" y1="76" x2="546.0" y2="282" class="grid"/><text x="546.0" y="298" class="t3" font-size="11" text-anchor="middle" font-weight="400">60%</text><line x1="658.0" y1="76" x2="658.0" y2="282" class="grid"/><text x="658.0" y="298" class="t3" font-size="11" text-anchor="middle" font-weight="400">80%</text><text x="198" y="99" class="t2" font-size="13" text-anchor="end" font-weight="400">FP8 matrix multiplies</text><path class="s1" d="M210,84 h394.15999999999997 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-394.15999999999997 z"/><text x="616.16" y="99" class="t1" font-size="13" text-anchor="start" font-weight="400">71.1%</text><text x="198" y="133" class="t2" font-size="13" text-anchor="end" font-weight="400">Norms, activations, quant.</text><path class="s1" d="M210,118 h93.43999999999998 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-93.43999999999998 z"/><text x="315.44" y="133" class="t1" font-size="13" text-anchor="start" font-weight="400">17.4%</text><text x="198" y="167" class="t2" font-size="13" text-anchor="end" font-weight="400">Other</text><path class="s1" d="M210,152 h24.0 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-24.0 z"/><text x="246.0" y="167" class="t1" font-size="13" text-anchor="start" font-weight="400">5.0%</text><text x="198" y="201" class="t2" font-size="13" text-anchor="end" font-weight="400">GDN conv1d + prep</text><path class="s2" d="M210,186 h15.599999999999998 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-15.599999999999998 z"/><text x="237.6" y="201" class="t1" font-size="13" text-anchor="start" font-weight="400">3.5%</text><text x="198" y="235" class="t2" font-size="13" text-anchor="end" font-weight="400">GDN core (chunked)</text><path class="s1" d="M210,220 h11.679999999999998 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-11.679999999999998 z"/><text x="233.68" y="235" class="t1" font-size="13" text-anchor="start" font-weight="400">2.8%</text><text x="198" y="269" class="t2" font-size="13" text-anchor="end" font-weight="400">Attention</text><rect x="210" y="254" width="1.1199999999999999" height="20" class="s1"/><text x="219.12" y="269" class="t1" font-size="13" text-anchor="start" font-weight="400">0.2%</text><text x="24" y="320" class="t2" font-size="12" text-anchor="start" font-weight="400">We made the highlighted kernels 30% faster, bit-exactly. End-to-end prefill: +0.8%, as their 3.5% share predicts.</text></svg>
