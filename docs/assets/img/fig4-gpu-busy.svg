</style><rect class="bg" width="720" height="246" rx="8"/><text x="24" y="34" class="t1" font-size="16" text-anchor="start" font-weight="600">GPU busy time in steady-state serving</text><text x="24" y="56" class="t2" font-size="13" text-anchor="start" font-weight="400">nsys, 1 H100, serving mix; share of wall time with a kernel running</text><text x="178" y="108" class="t2" font-size="13" text-anchor="end" font-weight="400">Default graph limit (512)</text><rect x="190" y="90" width="294.8" height="26" class="s1"/><rect x="486.8" y="90" width="143.2" height="26" class="s0"/><text x="200" y="108" fill="#ffffff" font-size="12" text-anchor="start" font-weight="600">busy 67%</text><text x="640" y="108" class="t2" font-size="12" text-anchor="start" font-weight="400">idle 33%</text><text x="178" y="162" class="t2" font-size="13" text-anchor="end" font-weight="400">Graph limit 2,048</text><rect x="190" y="144" width="382.8" height="26" class="s1"/><rect x="574.8" y="144" width="55.19999999999999" height="26" class="s0"/><text x="200" y="162" fill="#ffffff" font-size="12" text-anchor="start" font-weight="600">busy 87%</text><text x="640" y="162" class="t2" font-size="12" text-anchor="start" font-weight="400">idle 13%</text><text x="24" y="226" class="t2" font-size="12" text-anchor="start" font-weight="400">What idle time remains: 5–6% between steps (scheduler work), 2–3% inside steps, the rest at kernel boundaries.</text></svg>
