<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 246" width="720" height="246" role="img" aria-labelledby="t d"><title id="t">GPU busy time before and after</title><desc id="d">Two bars: GPU busy 67% at the default graph limit, 87% with a 2048 limit.</desc><style>
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#7a7975}
  .grid{stroke:#e6e5e0;stroke-width:1} .axis{stroke:#c9c8c2;stroke-width:1}
  .s1{fill:#2a78d6} .s2{fill:#eb6834} .s0{fill:#d9d8d2} .s1l{stroke:#2a78d6} .s2l{stroke:#eb6834}
